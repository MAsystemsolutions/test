<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SignedIt</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
:root{
  --bg:#f3f3f1;
  --panel:#fff;
  --soft:#f7f7f5;
  --ink:#25272a;
  --muted:#74777a;
  --line:#dedfdd;
  --dark:#303236;
  --accent:#666a70;
  --danger:#9a3f3f;
  --success:#456b4d;
  --shadow:0 10px 30px rgba(0,0,0,.07)
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,
input,
select,
textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

.top{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 24px;
  gap:24px;
  position:sticky;
  top:0;
  z-index:30
}

.brand{
  font:600 22px Georgia,serif;
  letter-spacing:-.5px
}

.nav{
  display:flex;
  gap:4px;
  height:100%;
  align-items:center
}

.nav button{
  border:0;
  background:none;
  padding:10px 13px;
  color:var(--muted);
  border-radius:7px
}

.nav button.active,
.nav button:hover{
  background:#f0f0ee;
  color:var(--ink)
}

.spacer{
  flex:1
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#34373a;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px
}

.userbox{
  display:flex;
  align-items:center;
  gap:9px
}

.userbox small{
  display:block;
  color:var(--muted);
  font-size:11px
}

.shell{
  display:flex;
  min-height:calc(100vh - 64px)
}

.side{
  width:230px;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px 14px
}

.side h4{
  margin:0 10px 10px;
  color:#999;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.3px
}

.side button{
  display:flex;
  width:100%;
  border:0;
  background:none;
  padding:10px 11px;
  border-radius:7px;
  text-align:left;
  color:#5d6063;
  margin-bottom:2px
}

.side button:hover,
.side button.active{
  background:#f0f0ee;
  color:#222
}

.side .count{
  margin-left:auto;
  color:#999
}

.main{
  flex:1;
  padding:30px 34px;
  min-width:0
}

.page-title{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:25px
}

.page-title h1{
  font:500 30px Georgia,serif;
  margin:0 0 5px
}

.sub{
  color:var(--muted)
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  color:#333;
  border-radius:7px;
  padding:9px 13px
}

.btn:hover{
  background:#f3f3f1
}

.btn.dark{
  background:#303236;
  border-color:#303236;
  color:#fff
}

.btn.ghost{
  background:transparent
}

.btn.danger{
  color:var(--danger)
}

.btn.success{
  color:var(--success)
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  box-shadow:0 2px 7px rgba(0,0,0,.02)
}

.template-card{
  min-height:150px;
  display:flex;
  flex-direction:column;
  justify-content:space-between
}

.template-name{
  font-weight:600
}

.meta{
  font-size:12px;
  color:var(--muted)
}

.card-actions{
  display:flex;
  gap:7px;
  align-items:center
}

.star{
  border:0;
  background:none;
  font-size:20px;
  color:#a7a9aa;
  padding:0
}

.star.on{
  color:#333
}

.empty{
  padding:70px 20px;
  text-align:center;
  color:var(--muted);
  border:1px dashed #cfd0ce;
  border-radius:10px;
  background:rgba(255,255,255,.5)
}

.status-chip{
  display:inline-flex;
  align-items:center;
  padding:4px 8px;
  border-radius:20px;
  background:#f0f0ee;
  color:#555;
  font-size:11px
}

.status-chip.action{
  background:#f4ece7;
  color:#80563f
}

.status-chip.pending{
  background:#efefec;
  color:#626262
}

.status-chip.completed{
  background:#e9f0ea;
  color:#4e6853
}

/* editor */

.editor-top{
  height:60px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 16px;
  gap:8px
}

.editor-name{
  min-width:220px;
  font-weight:600
}

.editor-layout{
  display:grid;
  grid-template-columns:190px minmax(450px,1fr) 270px;
  height:calc(100vh - 124px);
  overflow:hidden
}

.toolbox,
.properties{
  background:#fff;
  overflow:auto
}

.toolbox{
  border-right:1px solid var(--line);
  padding:16px 12px
}

.properties{
  border-left:1px solid var(--line);
  padding:18px
}

.toolgroup{
  margin-bottom:18px
}

.toolgroup h5{
  margin:0 8px 8px;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:#999
}

.field-tool{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:7px;
  padding:9px 10px;
  margin:3px 0;
  text-align:left;
  color:#444
}

.field-tool:hover{
  background:#f4f4f2
}

.canvas-wrap{
  overflow:auto;
  padding:30px;
  background:#e9e9e6
}

.doc-page{
  position:relative;
  margin:0 auto 25px;
  background:#fff;
  box-shadow:0 5px 20px rgba(0,0,0,.13);
  width:min(820px,90%)
}

.doc-page canvas{
  width:100%;
  height:auto;
  display:block
}

.overlay{
  position:absolute;
  inset:0
}

.field{
  position:absolute;
  border:1px solid #7b7e82;
  background:rgba(244,244,242,.88);
  border-radius:3px;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:18px;
  min-height:18px;
  user-select:none;
  touch-action:none
}

.field.selected{
  border:2px solid #36393c;
  background:rgba(232,232,228,.92);
  z-index:10
}

.field .tag{
  font-size:10px;
  color:#505256;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  padding:0 4px
}

.field .delete{
  position:absolute;
  right:-8px;
  top:-8px;
  width:17px;
  height:17px;
  border-radius:50%;
  border:0;
  background:#303236;
  color:#fff;
  font-size:12px;
  line-height:17px;
  padding:0;
  display:none
}

.field.selected .delete{
  display:block
}

.resize{
  position:absolute;
  right:-5px;
  bottom:-5px;
  width:10px;
  height:10px;
  background:#303236;
  border-radius:2px;
  display:none;
  cursor:nwse-resize
}

.field.selected .resize{
  display:block
}

.field input,
.field select{
  width:100%;
  height:100%;
  border:0;
  background:transparent;
  outline:0;
  padding:3px;
  font-size:11px
}

.field input[type=checkbox]{
  width:18px;
  height:18px
}

.prop h3{
  font:500 20px Georgia,serif;
  margin:0 0 18px
}

.prop label{
  display:block;
  font-size:11px;
  color:#777;
  margin:12px 0 5px
}

.prop input,
.prop select,
.prop textarea{
  width:100%;
  padding:8px;
  border:1px solid var(--line);
  border-radius:6px;
  background:#fff
}

.prop-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

/* auth/sign */

.modal{
  position:fixed;
  inset:0;
  background:rgba(20,20,20,.38);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100
}

.modal-card{
  background:#fff;
  width:min(470px,92vw);
  max-height:90vh;
  overflow:auto;
  border-radius:12px;
  padding:25px;
  box-shadow:var(--shadow)
}

.modal-card h2{
  font:500 25px Georgia,serif;
  margin:0 0 7px
}

.modal-card input,
.modal-card select{
  width:100%;
  padding:10px;
  border:1px solid var(--line);
  border-radius:7px;
  margin:6px 0 10px
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:14px
}

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  background:#303236;
  color:#fff;
  padding:11px 15px;
  border-radius:7px;
  z-index:200;
  box-shadow:var(--shadow);
  max-width:420px
}

/* signing */

.sign-shell{
  max-width:1050px;
  margin:0 auto;
  padding:28px
}

.sign-head{
  background:#fff;
  border:1px solid var(--line);
  padding:16px 20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  gap:15px;
  margin-bottom:18px
}

.sign-head h1{
  font:500 22px Georgia,serif;
  margin:0
}

.sign-doc{
  background:#e9e9e6;
  padding:25px
}

.sign-page{
  position:relative;
  margin:0 auto 20px;
  background:#fff;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
  max-width:820px
}

.sign-page canvas{
  width:100%;
  display:block
}

.sign-page .field{
  border:1px solid #aaa;
  background:#fafaf8
}

.sign-page .field.assigned{
  border:2px solid #3f4347;
  background:#f0f0ed
}

.sign-footer{
  display:flex;
  justify-content:flex-end;
  margin-top:18px
}

.notice{
  padding:11px 13px;
  background:#f5f5f2;
  border:1px solid var(--line);
  border-radius:7px;
  color:#5f6265
}

.processing-overlay{
  position:fixed;
  inset:0;
  background:rgba(243,243,241,.86);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:500
}

.processing-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px 34px;
  text-align:center;
  box-shadow:var(--shadow);
  min-width:280px
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #ddd;
  border-top-color:#303236;
  border-radius:50%;
  animation:siSpin .8s linear infinite;
  margin:0 auto 14px
}

@keyframes siSpin{
  to{transform:rotate(360deg)}
}

.team-row{
  display:grid;
  grid-template-columns:1.2fr 1.5fr .7fr .7fr;
  gap:10px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line)
}

.team-row:last-child{
  border-bottom:0
}

.envelope-row{
  padding:15px 0;
  border-bottom:1px solid var(--line)
}

.envelope-row:last-child{
  border-bottom:0
}

.recipient-line{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:6px 0;
  font-size:12px
}

.debug{
  font-size:11px;
  color:#999;
  word-break:break-word
}

@media(max-width:950px){
  .editor-layout{
    grid-template-columns:150px minmax(400px,1fr)
  }

  .properties{
    display:none
  }

  .side{
    width:190px
  }

  .nav{
    display:none
  }

  .team-row{
    grid-template-columns:1fr 1fr
  }
}

@media(max-width:700px){
  .side{
    display:none
  }

  .main{
    padding:20px
  }

  .editor-layout{
    grid-template-columns:1fr
  }

  .toolbox{
    display:none
  }

  .editor-top{
    height:auto;
    min-height:60px;
    flex-wrap:wrap
  }

  .doc-page{
    width:96%
  }

  .sign-shell{
    padding:12px
  }

  .top{
    padding:0 13px
  }

  .team-row{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';


/* =========================================================
   CONFIGURATION
   ========================================================= */

const API =
  'https://script.google.com/macros/s/AKfycbw3c1EGR_t6vg49Gui3AKxGWvBNspN_WlTc-yzqvdk0LUKYSGIBuLOsoc-JIngvJ4ko/exec';


/*
 * This is the public URL of THIS GitHub frontend.
 *
 * The browser uses this URL for:
 * - signer links
 * - invite links
 * - completed-document links
 *
 * location.origin + location.pathname is used dynamically,
 * so the same file continues to work if hosted on another
 * GitHub Pages path.
 */


/* =========================================================
   STATE
   ========================================================= */

const state = {

  token:
    localStorage.getItem(
      'si_token'
    ) || '',

  user:
    JSON.parse(
      localStorage.getItem(
        'si_user'
      ) || 'null'
    ),

  view:
    'dashboard',

  section:
    'saved',

  templates:
    [],

  dashboard:
    null,

  pdf:
    null,

  fields:
    [],

  pages:
    [],

  renderedPages:
    null,

  selected:
    null,

  tool:
    null,

  editorTemplateId:
    null,

  editorName:
    '',

  recipients:
    [],

  signingMode:
    'sequential',

  signToken:
    new URLSearchParams(
      location.search
    ).get('token'),

  completedMode:
    new URLSearchParams(
      location.search
    ).get('completed') === '1',

  inviteToken:
    new URLSearchParams(
      location.search
    ).get('invite'),

  signingBusy:
    false,

  sendBusy:
    false,

  inviteBusy:
    false,

  signSession:
    null
};


const $ =
  function(selector) {
    return document.querySelector(
      selector
    );
  };


const $$ =
  function(selector) {
    return document.querySelectorAll(
      selector
    );
  };


function esc(value) {
  return String(
    value ?? ''
  ).replace(
    /[&<>'"]/g,
    function(c) {
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[c];
    }
  );
}


/* =========================================================
   BASIC UI
   ========================================================= */

function toast(message) {

  const element =
    document.createElement(
      'div'
    );

  element.className =
    'toast';

  element.textContent =
    message;

  $('#toastRoot')
    .append(element);

  setTimeout(
    function() {
      element.remove();
    },
    3000
  );
}


function initials(name) {

  return String(
    name || 'U'
  )
    .split(/\s+/)
    .slice(0,2)
    .map(function(x) {
      return x[0];
    })
    .join('')
    .toUpperCase();
}


function showProcessing(
  title,
  message
) {

  let root =
    document.getElementById(
      'processingRoot'
    );

  if (!root) {
    root =
      document.createElement(
        'div'
      );

    root.id =
      'processingRoot';

    document.body.append(
      root
    );
  }

  root.innerHTML = `
    <div class="processing-overlay">
      <div class="processing-card">
        <div class="spinner"></div>
        <div style="font:500 20px Georgia,serif;margin-bottom:7px">
          ${esc(title)}
        </div>
        <div class="sub" style="line-height:1.5">
          ${esc(message)}
        </div>
      </div>
    </div>
  `;
}


function hideProcessing() {

  const root =
    document.getElementById(
      'processingRoot'
    );

  if (root) {
    root.remove();
  }
}


/* =========================================================
   API
   ========================================================= */

/*
 * IMPORTANT:
 * We deliberately use text/plain here.
 *
 * This avoids the browser sending an OPTIONS preflight
 * request to Apps Script, which can cause the common
 * "Could not reach backend" error with Google Apps Script.
 */
async function api(
  action,
  data = {}
) {

  try {

    if (!API) {
      throw new Error(
        'SignedIt API URL is empty.'
      );
    }

    const response =
      await fetch(
        API,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify({
              action,
              token:
                state.token || '',
              data
            })
        }
      );

    const raw =
      await response.text();

    console.log(
      'SignedIt API:',
      action,
      'HTTP',
      response.status,
      raw
    );

    if (!response.ok) {

      return {
        success:false,
        error:'HTTP_ERROR',
        message:
          'SignedIt backend returned HTTP ' +
          response.status +
          '.'
      };
    }

    let result;

    try {

      result =
        JSON.parse(raw);

    } catch (parseError) {

      console.error(
        'SignedIt invalid JSON:',
        raw
      );

      return {
        success:false,
        error:
          'INVALID_RESPONSE',
        message:
          'SignedIt received an invalid response from the backend.'
      };
    }

    if (
      !result ||
      typeof result !==
        'object'
    ) {

      return {
        success:false,
        error:
          'INVALID_RESPONSE',
        message:
          'SignedIt received an empty response from the backend.'
      };
    }

    if (
      !result.success &&
      result.error ===
        'UNAUTHORIZED'
    ) {
      logoutLocal();
    }

    return result;

  } catch (error) {

    console.error(
      'SignedIt API connection error:',
      error
    );

    return {
      success:false,
      error:
        'NETWORK_ERROR',
      message:
        'Could not reach the SignedIt backend. ' +
        (
          error &&
          error.message
            ? error.message
            : ''
        )
    };
  }
}


async function testBackend() {

  try {

    const response =
      await fetch(
        API,
        {
          method:'GET',
          cache:'no-store'
        }
      );

    const raw =
      await response.text();

    console.log(
      'SignedIt GET health check:',
      response.status,
      raw
    );

    if (!response.ok) {
      throw new Error(
        'HTTP ' +
        response.status
      );
    }

    return JSON.parse(
      raw
    );

  } catch (error) {

    console.error(
      'SignedIt health check failed:',
      error
    );

    return {
      success:false,
      message:
        error.message ||
        'Backend health check failed.'
    };
  }
}


/* =========================================================
   AUTH
   ========================================================= */

function logoutLocal() {

  state.token =
    '';

  state.user =
    null;

  localStorage.removeItem(
    'si_token'
  );

  localStorage.removeItem(
    'si_user'
  );

  render();
}


function authRequired() {

  if (!state.token) {
    showLogin();
    return false;
  }

  return true;
}


function showLogin() {

  modal(`
    <h2>Log in to SignedIt</h2>

    <div class="sub">
      Only administrators and team users have accounts.
    </div>

    <label>Email</label>
    <input id="mEmail" type="email">

    <label>Password</label>
    <input id="mPass" type="password">

    <div id="mErr"
         class="small"
         style="min-height:18px">
    </div>

    <div class="modal-actions">
      <button class="btn"
              onclick="closeModal()">
        Cancel
      </button>

      <button class="btn dark"
              id="loginButton"
              onclick="doLogin()">
        Log in
      </button>
    </div>
  `);
}


function modal(html) {

  $('#modalRoot').innerHTML = `
    <div class="modal"
         onclick="if(event.target===this)closeModal()">

      <div class="modal-card">
        ${html}
      </div>

    </div>
  `;
}


function closeModal() {

  $('#modalRoot')
    .innerHTML = '';
}


async function doLogin() {

  const button =
    $('#loginButton');

  if (button) {
    button.disabled =
      true;
    button.textContent =
      'Logging in…';
  }

  const email =
    $('#mEmail')
      ? $('#mEmail').value.trim()
      : '';

  const password =
    $('#mPass')
      ? $('#mPass').value
      : '';

  const result =
    await api(
      'login',
      {
        email,
        password
      }
    );

  if (!result.success) {

    const error =
      $('#mErr');

    if (error) {
      error.textContent =
        result.message ||
        'Unable to log in.';
    }

    if (button) {
      button.disabled =
        false;
      button.textContent =
        'Log in';
    }

    return;
  }

  state.token =
    result.data.token;

  state.user =
    result.data;

  localStorage.setItem(
    'si_token',
    state.token
  );

async function acceptInviteFromPage() {

  if (
    state.inviteBusy ||
    !state.inviteToken
  ) {
    return;
  }

  const password =
    $('#invitePassword')
      ? $('#invitePassword').value
      : '';

  const confirm =
    $('#invitePassword2')
      ? $('#invitePassword2').value
      : '';

  const error =
    $('#inviteErr');

  if (password.length < 8) {

    if (error) {
      error.textContent =
        'Password must be at least 8 characters.';
    }

    return;
  }

  if (password !== confirm) {

    if (error) {
      error.textContent =
        'Passwords do not match.';
    }

    return;
  }

  state.inviteBusy =
    true;

  const button =
    $('#acceptInviteButton');

  if (button) {
    button.disabled =
      true;
    button.textContent =
      'Activating…';
  }

  const result =
    await api(
      'acceptInvite',
      {
        token:
          state.inviteToken,
        password
      }
    );

  if (!result.success) {

    state.inviteBusy =
      false;

    if (error) {
      error.textContent =
        result.message;
    }

    if (button) {
      button.disabled =
        false;
      button.textContent =
        'Activate account';
    }

    return;
  }

  closeModal();

  toast(
    'Account activated. You can now log in.'
  );

  state.inviteToken =
    null;

  const clean =
    location.origin +
    location.pathname;

  history.replaceState(
    {},
    document.title,
    clean
  );

  showLogin();
}

async function loadDashboard() {

  const main =
    $('#main');

  if (!main) return;

  main.innerHTML =
    '<div class="sub">Loading workspace…</div>';

  const result =
    await api(
      'listDashboard'
    );

  if (!result.success) {

    main.innerHTML = `
      <div class="empty">

        <b>Unable to load workspace.</b>

        <div style="margin-top:7px">
          ${esc(
            result.message ||
            'Unknown backend error.'

        </div>

        <div class="debug"
             style="margin-top:12px">
          ${esc(
            result.error ||
            ''
          )}
        </div>

        <div style="margin-top:18px">
          <button class="btn"
                  onclick="loadDashboard()">
            Try again
          </button>
        </div>

      </div>
    `;

    return;
  }

  state.dashboard =
    result.data || {};

  if (
    state.section ===
    'team'
  ) {

    renderTeam();

    return;
  }

  let list = [];
  let title = 'Saved';

  if (
    state.section ===
    'created'
  ) {

    list =
      state.dashboard.createdByMe ||
      [];

    title =
      'Created by Me';

  } else if (
    state.section ===
    'shared'
  ) {

    list =
      state.dashboard.sharedWithMe ||
      [];

    title =
      'Shared with Me';

  } else if (
    state.section ===
    'recent'
  ) {

    list =
      state.dashboard.recentlyUsed ||
      [];

    title =
      'Recently Used';

  } else if (
    state.section ===
    'favorites'
  ) {

    list =
      state.dashboard.favorites ||
      [];

    title =
      'Favorites';

  } else if (
    state.section ===
    'templates'
  ) {

    list =
      state.dashboard.saved ||
      [];

    title =
      'Templates';

  } else if (
    state.section ===
    'action'
  ) {

    renderEnvelopeSection(
      'Action Required',
      state.dashboard.actionRequired ||
        []
    );

    return;

  } else if (
    state.section ===
    'pending'
  ) {

    renderEnvelopeSection(
      'Pending',

async function sendInvite() {

  if (state.inviteBusy) {
    return;
  }

  const name =
    $('#inviteName')
      ? $('#inviteName').value.trim()
      : '';

  const email =
    $('#inviteEmail')
      ? $('#inviteEmail').value.trim()
      : '';

  const role =
    $('#inviteRole')
      ? $('#inviteRole').value
      : 'user';

  const error =
    $('#inviteUserErr');

  if (!name || !email) {

    if (error) {
      error.textContent =
        'Name and email are required.';
    }

    return;
  }

  /*
   * This must NEVER be empty.
   */
  const acceptUrl =
    getFrontendUrl();

  if (!acceptUrl) {

    if (error) {
      error.textContent =
        'SignedIt could not determine the invitation URL.';
    }

    return;
  }

  state.inviteBusy =
    true;

  const button =
    $('#sendInviteButton');

  if (button) {
    button.disabled =
      true;
    button.textContent =
      'Sending…';
  }

  const result =
    await api(
      'inviteUser',
      {
        name,
        email,
        role,
        acceptUrl
      }
    );

  if (!result.success) {

    state.inviteBusy =
      false;

    if (error) {
      error.textContent =
        result.message;
    }

    if (button) {
      button.disabled =
        false;
      button.textContent =
        'Send invitation';
    }

    return;
  }

  closeModal();

  toast(
    'Invitation sent successfully.'
  );

  state.inviteBusy =
    false;
}

async function openTemplate(
  id
) {

  const result =
    await api(
      'getTemplate',
      {
        templateId:
          id
      }
    );

  if (!result.success) {

    toast(
      result.message
    );

    return;
  }

  state.editorTemplateId =
    id;

  state.fields =
    result.data.fields ||
    [];

  state.selected =
    null;

  await loadEditorPdf(
    fromB64(
      result.data.pdfBase64
    )
  );

  state.editorName =
    result.data.name;

  state.view =
    'editor';

  render();
}


function fromB64(
  value
) {

  const bytes =
    Uint8Array.from(
      atob(value),
      function(c) {
        return c.charCodeAt(0);
      }
    );

  return bytes.buffer;
}


function toB64(
  buffer
) {

  const bytes =
    new Uint8Array(
      buffer
    );

  let output =
    '';

  for (
    let i = 0;
    i < bytes.length;
    i += 0x8000
  ) {
    output +=
      String.fromCharCode(
        ...bytes.subarray(
          i,
          i + 0x8000
        )
      );
  }

  return btoa(
    output
  );
}


async function loadEditorPdf(
  buffer
) {

  state.pdf =
    buffer;

  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          new Uint8Array(
            buffer.slice(0)
          )
      })
      .promise;

  state.pages =
    [];

  state.renderedPages =
    [];

  const holder =
    document.createElement(
      'div'
    );

  for (
    let pageNumber = 1;
    pageNumber <= pdf.numPages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(
        pageNumber
      );

    const viewport =
      page.getViewport({
        scale:1.5
      });

    const canvas =
      document.createElement(
        'canvas'
      );

    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;

    await page.render({
      canvasContext:
        canvas.getContext(
          '2d'
        ),
      viewport
    }).promise;

    const pageElement =
      document.createElement(
        'div'
      );

    pageElement.className =
      'doc-page';

    const overlay =
      document.createElement(
        'div'
      );

    overlay.className =
      'overlay';

    overlay.dataset.page =
      pageNumber - 1;

    pageElement.append(
      canvas,
      overlay
    );

    state.pages.push({
      ov: overlay,
      ratio:
        viewport.width /
        viewport.height
    });

    holder.append(
      pageElement
    );
  }

  state.renderedPages =
    Array.from(
      holder.children
    );
}

            ),

function tool(
  type,
  label
) {

  return `
    <button
      class="field-tool"
      onclick="
        selectTool(
          '${type}'
        )
      ">
      ${esc(label)}
    </button>
  `;
}


function selectTool(
  type
) {

  state.tool =
    state.tool === type
      ? null
      : type;

  toast(
    state.tool
      ? 'Click the document to place ' +
        type
      : 'Field tool cancelled'
  );
}


function placeField(
  event,
  overlay
) {

  if (
    !state.tool ||
    event.target !== overlay
  ) {
    return;
  }

  const rect =
    overlay.getBoundingClientRect();

  const page =
    state.pages[
      +overlay.dataset.page
    ];

  const sizes = {
    signature:
      [.28,.07],
    initials:
      [.12,.05],
    text:
      [.25,.04],
    long_text:
      [.35,.09],
    number:
      [.16,.04],
    name:
      [.25,.04],
    email:
      [.28,.04],
    date:
      [.18,.04],
    checkbox:
      [.035,.035],
    dropdown:
      [.25,.04],
    radio:
      [.05,.05],
    address:
      [.35,.08],
    company:
      [.25,.04],
    job_title:
      [.25,.04]
  };

  const size =
    sizes[state.tool] ||
    [.2,.04];

  const w =
    size[0];

  const h =
    size[1];

  const x =
    Math.max(
      0,
      Math.min(
        (event.clientX -
          rect.left) /
          rect.width,
        1 - w
      )
    );

  const y =
    Math.max(
      0,
      Math.min(
        (event.clientY -
          rect.top) /
          rect.height,
        1 - h
      )
    );

  state.fields.push({

    id:
      crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random()
            .toString(36)
            .slice(2),

    type:
      state.tool,

    page:
      +overlay.dataset.page,

    x,
    y,
    w,
    h,

    required:
      state.tool !==
      'checkbox',

    recipientRole:
      '1',

    value:
      state.tool ===
      'checkbox'
        ? false
        : '',

    properties:{
      options:[
        'Option 1',
        'Option 2'
      ],
      radioGroup:
        'group1'
    }
  });

  state.tool =
    null;

  renderFields();
}


function renderFields() {

  state.pages.forEach(
    function(page) {

      page.ov.innerHTML =
        '';

      page.ov.onclick =
        function(event) {
          placeField(
            event,
            page.ov
          );
        };
    }
  );

  state.fields.forEach(
    function(field) {

      const element =
        document.createElement(
          'div'
        );

      element.className =
        'field' +
        (
          state.selected ===
          field.id
            ? ' selected'
            : ''
        );

      element.style.cssText =
        `
          left:${field.x * 100}%;
          top:${field.y * 100}%;
          width:${field.w * 100}%;
          height:${field.h * 100}%
        `;

      element.onclick =
        function(event) {

          event.stopPropagation();

          state.selected =
            field.id;

          renderFields();
        };

      const deleteButton =
        document.createElement(
          'button'
        );

      deleteButton.className =
        'delete';

      deleteButton.textContent =
        '×';

      deleteButton.onclick =
        function(event) {

          event.stopPropagation();

          state.fields =
            state.fields.filter(
              function(x) {
                return (
                  x.id !==
                  field.id
                );
              }
            );

          state.selected =
            null;

          renderFields();
        };

      element.append(
        deleteButton
      );

      const tag =
        document.createElement(
          'div'
        );

      tag.className =
        'tag';

      tag.textContent =
        field.type ===
        'checkbox'
          ? '☐'
          : field.type.replace(
              '_',
              ' '
            );

      element.append(
        tag
      );

      const resize =
        document.createElement(
          'div'
        );

      resize.className =
        'resize';

      resize.onpointerdown =
        function(event) {
          dragField(
            event,
            field,
            element,
            'resize'
          );
        };

      element.append(
        resize
      );

      element.onpointerdown =
        function(event) {

          if (
            event.target ===
              deleteButton ||
            event.target ===
              resize
          ) {
            return;
          }

          dragField(
            event,
            field,
            element,
            'move'
          );
        };

      if (
        state.pages[
          field.page
        ]
      ) {
        state.pages[
          field.page
        ].ov.append(
          element
        );
      }

    }
  );

  renderProperties();
}


function dragField(
  event,
  field,
  element,
  kind
) {

  event.preventDefault();
  event.stopPropagation();

  state.selected =
    field.id;

  const rect =
    element.parentElement
      .getBoundingClientRect();

  const startX =
    event.clientX;

  const startY =
    event.clientY;

  const oldX =
    field.x;

  const oldY =
    field.y;

  const oldW =
    field.w;

  const oldH =
    field.h;

  const move =
    function(ev) {

      const dx =
        (
          ev.clientX -
          startX
        ) /
        rect.width;

      const dy =
        (
          ev.clientY -
          startY
        ) /
        rect.height;

      if (
        kind ===
        'move'
      ) {

        field.x =
          Math.min(
            Math.max(
              oldX + dx,
              0
            ),
            1 - field.w
          );

        field.y =
          Math.min(
            Math.max(
              oldY + dy,
              0
            ),
            1 - field.h
          );

      } else {

        field.w =
          Math.min(
            Math.max(
              oldW + dx,
              .02
            ),
            1 - field.x
          );

        field.h =
          Math.min(
            Math.max(
              oldH + dy,
              .02
            ),
            1 - field.y
          );
      }

      element.style.left =
        field.x * 100 + '%';

      element.style.top =
        field.y * 100 + '%';

      element.style.width =
        field.w * 100 + '%';

      element.style.height =
        field.h * 100 + '%';
    };

  const up =
    function() {

      removeEventListener(
        'pointermove',
        move
      );

      removeEventListener(
        'pointerup',
        up
      );

      renderProperties();
    };

  addEventListener(
    'pointermove',
    move
  );

  addEventListener(
    'pointerup',
    up
  );
}


function renderProperties() {

  const panel =
    $('#properties');

  if (!panel) return;

  const field =
    state.fields.find(
      function(x) {
        return (
          x.id ===
          state.selected
        );
      }
    );

  if (!field) {

    panel.innerHTML =
      `
        <div class="small">
          Select a field to edit its properties.
        </div>
      `;

    return;
  }

  panel.innerHTML = `

    <div class="prop">

      <h3>
        ${esc(
          field.type.replace(
            '_',
            ' '
          )
        )}
      </h3>

      <label>
        Assigned signer
      </label>

      <select id="pRecipient">

        <option value="1"
          ${
            field.recipientRole === '1'
              ? 'selected'
              : ''
          }>
          Signer 1
        </option>

        <option value="2"
          ${
            field.recipientRole === '2'
              ? 'selected'
              : ''
          }>
          Signer 2
        </option>

        <option value="3"
          ${
            field.recipientRole === '3'
              ? 'selected'
              : ''
          }>
          Signer 3
        </option>

      </select>

      <label>
        Required
      </label>

      <select id="pReq">

        <option value="1"
          ${
            field.required
              ? 'selected'
              : ''
          }>
          Required
        </option>

        <option value="0"
          ${
            !field.required
              ? 'selected'
              : ''
          }>
          Optional
        </option>

      </select>

      ${
        field.type ===
        'dropdown'
          ? `
            <label>
              Dropdown options (one per line)
            </label>

            <textarea
              id="pOpts"
              rows="6">${esc(
                (
                  field.properties &&
                  field.properties.options
                ) ||
                []
              .join('\n')
              )}</textarea>
          `
          : ''
      }

      ${
        field.type ===
        'number'
          ? `
            <label>
              Number rules
            </label>

            <div class="small">
              Numbers only are enforced during signing.
            </div>
          `
          : ''
      }

      <div class="small"
           style="margin-top:16px">
        Position and size are saved when the template is saved.
      </div>

    </div>
  `;

  $('#pRecipient').onchange =
    function(event) {
      field.recipientRole =
        event.target.value;
    };

  $('#pReq').onchange =
    function(event) {
      field.required =
        event.target.value ===
        '1';
    };

  const options =
    $('#pOpts');

  if (options) {

    options.oninput =
      function(event) {

        field.properties.options =
          event.target.value
            .split('\n')
            .map(function(x) {
              return x.trim();
            })
            .filter(Boolean);
      };
  }
}

async function saveTemplate() {

  if (!state.pdf) {
    toast(
      'No PDF loaded.'
    );
    return;
  }

  const name =
    state.editorName ||
    prompt(
      'Template name:',
      'Untitled template'
    );

  if (!name) {
    return;
  }

  state.editorName =
    name;

  showProcessing(
    'Saving template…',
    'Please wait while SignedIt saves your template.'
  );

  try {

    const result =
      await api(
        'saveTemplate',
        {
          name,
          pdfBase64:
            toB64(
              state.pdf
            ),
          fields:
            state.fields.map(
              function(field) {
                return {
                  page:
                    field.page,
                  type:
                    field.type,
                  x:
                    field.x,
                  y:
                    field.y,
                  w:
                    field.w,
                  h:
                    field.h,
                  required:
                    field.required,
                  recipientRole:
                    field.recipientRole,
                  properties:
                    field.properties
                };
              }
            )
        }
      );

    hideProcessing();

    if (!result.success) {

      toast(
        result.message
      );

      return;
    }

    state.editorTemplateId =
      result.data.templateId;

    toast(
      'Template saved.'
    );

  } catch(error) {

    hideProcessing();

    toast(
      'Could not save template.'
    );

    console.error(
      error
    );
  }
}

  ) {

  });

function getFrontendUrl() {

  const url =
    location.origin +
    location.pathname;

  if (
    !url ||
    url ===
      'null' ||
    !/^https?:\/\//i.test(url)
  ) {
    return '';
  }

  return url.replace(
    /\/+$/,
    ''
  );
}


async function createAndSend(
  templateId
) {

  if (
    state.sendBusy
  ) {
    return;
  }

  state.recipients =
    state.recipients.map(
      function(r, index) {

        return {
          name:
            $(
              '#rn' +
              index
            )
              ? $(
                  '#rn' +
                  index
                ).value.trim()
              : '',

          email:
            $(
              '#re' +
              index
            )
              ? $(
                  '#re' +
                  index
                ).value.trim()
              : ''
        };

      }
    );

  if (
    state.recipients.some(
      function(r) {
        return (
          !r.name ||
          !r.email
        );
      }
    )
  ) {

    toast(
      'Complete every signer.'
    );

    return;
  }

  const signingUrl =
    getFrontendUrl();

  /*
   * NEVER allow an empty signing URL.
   */
  if (!signingUrl) {

    toast(
      'SignedIt could not determine the signing URL.'
    );

    return;
  }

  state.sendBusy =
    true;

  const button =
    $('#createSendButton');

  if (button) {
    button.disabled =
      true;
    button.innerHTML =
      `
        <span style="
          display:inline-flex;
          align-items:center;
          gap:8px
        ">
          <span class="spinner"
                style="
                  width:15px;
                  height:15px;
                  border-width:2px;
                  margin:0
                ">
          </span>

          Sending…
        </span>
      `;
  }

  showProcessing(
    'Sending document…',
    'Please wait. SignedIt is creating the signing transaction and sending the first signing links.'
  );

  try {

    const mode =
      $('#sendMode')
        ? $('#sendMode').value
        : 'sequential';

    const created =
      await api(
        'createEnvelope',
        {
          templateId,
          signingMode:
            mode,
          recipients:
            state.recipients
        }
      );

    if (!created.success) {

      hideProcessing();

      state.sendBusy =
        false;

      if (button) {
        button.disabled =
          false;
        button.textContent =
          'Create & send';
      }

      toast(
        created.message
      );

      return;
    }

    const sent =
      await api(
        'sendEnvelope',
        {
          envelopeId:
            created.data.envelopeId,

          signingUrl
        }
      );

    hideProcessing();

    if (!sent.success) {

      state.sendBusy =
        false;

      if (button) {
        button.disabled =
          false;
        button.textContent =
          'Create & send';
      }

      toast(
        sent.message
      );

      return;
    }

    closeModal();

    state.sendBusy =
      false;

    toast(
      sent.data &&
      sent.data.alreadySent
        ? 'Document was already sent.'
        : 'Document sent successfully.'
    );

    state.section =
      'pending';

    loadDashboard();

  } catch(error) {

    hideProcessing();

    state.sendBusy =
      false;

    if (button) {
      button.disabled =
        false;
      button.textContent =
        'Create & send';
    }

    toast(
      'Could not send document: ' +
      (
        error.message ||
        'Unknown error'
      )
    );

    console.error(
      'SignedIt send error:',
      error
    );
  }
}

async function renderSignPdf(
  data
) {

  const pdf =
    await pdfjsLib
      .getDocument({
        data:
          new Uint8Array(
            fromB64(
              data.pdfBase64
            )
          )
      })
      .promise;

  const host =
    $('#signDoc');

  if (!host) return;

  for (
    let pageNumber = 1;
    pageNumber <=
      pdf.numPages;
    pageNumber++
  ) {

    const page =
      await pdf.getPage(
        pageNumber
      );

    const viewport =
      page.getViewport({
        scale:1.5
      });

    const canvas =
      document.createElement(
        'canvas'
      );

    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;

    await page.render({
      canvasContext:
        canvas.getContext(
          '2d'
        ),
      viewport
    }).promise;

    const pageElement =
      document.createElement(
        'div'
      );

    pageElement.className =
      'sign-page';

    const overlay =
      document.createElement(
        'div'
      );

    overlay.className =
      'overlay';

    pageElement.append(
      canvas,
      overlay
    );

    host.append(
      pageElement
    );

    data.fields
      .filter(function(f) {
        return (
          f.page ===
          pageNumber - 1
        );
      })
      .forEach(function(field) {

        const element =
          document.createElement(
            'div'
          );

        element.dataset.fieldId =
          field.id;

        const owned =
          !field.recipientRole ||
          String(
            field.recipientRole
          ) ===
          String(
            data.recipient.sequence
          );

        element.className =
          'field' +
          (
            owned
              ? ' assigned'
              : ''
          );

        element.style.cssText =
          `
            left:${field.x * 100}%;
            top:${field.y * 100}%;
            width:${field.w * 100}%;
            height:${field.h * 100}%
          `;

        /*
         * Previous signers' values are already
         * burned into the PDF.
         *
         * Do not draw another input over them.
         */
        if (!owned) {

          element.style.pointerEvents =
            'none';

          element.style.background =
            'transparent';

          element.style.border =
            '0';

          return;
        }

        if (
          field.type ===
            'signature' ||
          field.type ===
            'initials'
        ) {

          element.textContent =
            field.value
              ? 'Signed'
              : 'Click to sign';

          element.onclick =
            function() {
              signatureFor(
                field,
                element
              );
            };

        } else if (
          field.type ===
          'checkbox'
        ) {

          const checkbox =
            document.createElement(
              'input'
            );

          checkbox.type =
            'checkbox';

          checkbox.checked =
            field.value === true ||
            field.value ===
              'true';

          checkbox.onchange =
            function() {
              field.value =
                checkbox.checked;
            };

          element.append(
            checkbox
          );

        } else if (
          field.type ===
          'dropdown'
        ) {

          const select =
            document.createElement(
              'select'
            );

          (
            field.properties &&
            field.properties.options
              ? field.properties.options
              : []
          ).forEach(
            function(option) {

              const optionElement =
                document.createElement(
                  'option'
                );

              optionElement.textContent =
                option;

              optionElement.value =
                option;

              select.append(
                optionElement
              );
            }
          );

          select.value =
            field.value ||
            '';

          select.onchange =
            function() {
              field.value =
                select.value;
            };

          element.append(
            select
          );

        } else if (
          field.type ===
          'number'
        ) {

          const input =
            document.createElement(
              'input'
            );

          input.type =
            'number';

          input.value =
            field.value ||
            '';

          input.oninput =
            function() {
              field.value =
                input.value;
            };

          element.append(
            input
          );

        } else if (
          field.type ===
          'date'
        ) {

          const input =
            document.createElement(
              'input'
            );

          input.type =
            'date';

          input.value =
            field.value ||
            '';

          input.oninput =
            function() {
              field.value =
                input.value;
            };

          element.append(
            input
          );

        } else {

          const input =
            document.createElement(
              'input'
            );

          input.type =
            'text';

          input.value =
            field.value ||
            '';

          input.placeholder =
            field.type.replace(
              '_',
              ' '
            );

          input.oninput =
            function() {
              field.value =
                input.value;
            };

          element.append(
            input
          );
        }

        overlay.append(
          element
        );
      });
  }
}


/* =========================================================
   SIGNATURE PAD
   ========================================================= */

let sigTarget =
  null;

let sigTargetElement =
  null;


function signatureFor(
  field,
  element
) {

  sigTarget =
    field;

  sigTargetElement =
    element;

  modal(`

    <h2>
      Your signature
    </h2>

    <canvas
      id="sigPad"
      width="600"
      height="180"
      style="
        width:100%;
        border:1px dashed #aaa;
        border-radius:7px;
        touch-action:none
      ">
    </canvas>

    <div class="modal-actions">

      <button class="btn"
              onclick="closeModal()">
        Cancel
      </button>

      <button class="btn dark"
              onclick="applySignerSig()">
        Apply
      </button>

    </div>
  `);

  const canvas =
    $('#sigPad');

  const context =
    canvas.getContext(
      '2d'
    );

  let drawing =
    false;

  canvas.onpointerdown =
    function(event) {

      drawing =
        true;

      canvas.setPointerCapture(
        event.pointerId
      );

      const rect =
        canvas.getBoundingClientRect();

      context.beginPath();

      context.moveTo(
        (
          event.clientX -
          rect.left
        ) *
          canvas.width /
          rect.width,

        (
          event.clientY -
          rect.top
        ) *
          canvas.height /
          rect.height
      );
    };

  canvas.onpointermove =
    function(event) {

      if (!drawing) {
        return;
      }

      const rect =
        canvas.getBoundingClientRect();

      context.lineWidth =
        3;

      context.lineCap =
        'round';

      context.lineTo(
        (
          event.clientX -
          rect.left
        ) *
          canvas.width /
          rect.width,

        (
          event.clientY -
          rect.top
        ) *
          canvas.height /
          rect.height
      );

      context.stroke();
    };

  canvas.onpointerup =
    function() {
      drawing =
        false;
    };
}


function applySignerSig() {

  const canvas =
    $('#sigPad');

  if (
    !canvas ||
    !sigTarget
  ) {
    return;
  }

  sigTarget.value =
    canvas.toDataURL(
      'image/png'
    );

  closeModal();

  if (
    sigTargetElement
  ) {

    sigTargetElement.textContent =
      'Signed';

    sigTargetElement.classList.add(
      'assigned'
    );
  }

  sigTarget =
    null;

  sigTargetElement =
    null;
}


/* =========================================================
   SUBMIT SIGNER
   ========================================================= */

async function submitSigner() {

  if (
    state.signingBusy
  ) {
    return;
  }

  if (
    !state.signSession
  ) {
    toast(
      'Signing session is unavailable.'
    );
    return;
  }

  const values = {};

  for (
    const field of
    state.signSession.fields
  ) {

    const owned =
      !field.recipientRole ||
      String(
        field.recipientRole
      ) ===
      String(
        state.signSession
          .recipient
          .sequence
      );

    if (!owned) {
      continue;
    }

    if (
      field.required &&
      (
        !field.value ||
        String(field.value) === ''
      )
    ) {

      toast(
        'Please complete all required fields.'
      );

      return;
    }

    if (
      field.type ===
        'number' &&
      field.value !== '' &&
      !/^[-+]?\d*(\.\d+)?$/.test(
        String(field.value)
      )
    ) {

      toast(
        'Number fields accept numbers only.'
      );

      return;
    }

    values[
      field.id
    ] =
      field.value;
  }

  state.signingBusy =
    true;

  const button =
    $('#finishSigningButton');

  if (button) {

    button.disabled =
      true;

    button.innerHTML = `
      <span style="
        display:inline-flex;
        align-items:center;
        gap:8px
      ">

        <span class="spinner"
              style="
                width:15px;
                height:15px;
                border-width:2px;
                margin:0
              ">
        </span>

        Processing…

      </span>
    `;
  }

  showProcessing(
    'Processing your signature…',
    'Please wait while SignedIt saves your signing step. Do not close or refresh this page.'
  );

  try {

    const finalPdfBase64 =
      await buildCompletedPdf();

    const signingUrl =
      getFrontendUrl();

    if (!signingUrl) {
      throw new Error(
        'The signing URL could not be determined.'
      );
    }

    const result =
      await api(
        'submitSigning',
        {
          token:
            state.signToken,

          values,

          pdfBase64:
            finalPdfBase64,

          signingUrl
        }
      );

    hideProcessing();

    if (!result.success) {

      state.signingBusy =
        false;

      if (button) {

        button.disabled =
          false;

        button.textContent =
          'Finish signing';
      }

      toast(
        result.message
      );

      return;
    }

    /*
     * Do NOT render the signing session again.
     *
     * This prevents the signer from clicking the button
     * again and accidentally creating another version.
     */

    if (
      result.data &&
      result.data.envelopeCompleted
    ) {

      $('#app').innerHTML = `

        <div class="sign-shell">

          <div class="empty">

            <div class="brand"
                 style="margin-bottom:12px">
              SignedIt
            </div>

            <h2 style="
              font:500 28px Georgia,serif
            ">
              Document completed.
            </h2>

            <div>
              All required signers have completed the document.
            </div>

            <div style="margin-top:10px">
              A copy of the completed signed document
              has been sent to all signers.
            </div>

            <div style="margin-top:18px">

              <button class="btn dark"
                      onclick="downloadCompleted()">
                Download signed document
              </button>

            </div>

          </div>

        </div>
      `;

    } else {

      $('#app').innerHTML = `

        <div class="sign-shell">

          <div class="empty">

            <div class="brand"
                 style="margin-bottom:12px">
              SignedIt
            </div>

            <h2 style="
              font:500 28px Georgia,serif
            ">
              Thank you.
            </h2>

            <div>
              Your signing step has been completed successfully.
            </div>

            <div style="margin-top:10px">
              You can no longer edit this signing step.
            </div>

            <div style="margin-top:10px">
              The document has been sent to the next signer.
            </div>

          </div>

        </div>
      `;
    }

  } catch(error) {

    hideProcessing();

    state.signingBusy =
      false;

    if (button) {

      button.disabled =
        false;

      button.textContent =
        'Finish signing';
    }

    toast(
      'Could not prepare the document: ' +
      (
        error &&
        error.message
          ? error.message
          : 'Unknown error'
      )
    );

    console.error(
      'SignedIt PDF preparation error:',
      error
    );
  }
}


/* =========================================================
   PDF GENERATION
   ========================================================= */

function pdfFieldRect(
  page,
  field
) {

  const pageWidth =
    page.getWidth();

  const pageHeight =
    page.getHeight();

  const nx =
    Math.max(
      0,
      Math.min(
        1,
        Number(field.x) ||
          0
      )
    );

  const ny =
    Math.max(
      0,
      Math.min(
        1,
        Number(field.y) ||
          0
      )
    );

  const nw =
    Math.max(
      0,
      Math.min(
        1 - nx,
        Number(field.w) ||
          0
      )
    );

  const nh =
    Math.max(
      0,
      Math.min(
        1 - ny,
        Number(field.h) ||
          0
      )
    );

  return {
    x:
      nx * pageWidth,

    y:
      pageHeight -
      (
        (ny + nh) *
        pageHeight
      ),

    width:
      nw * pageWidth,

    height:
      nh * pageHeight
  };
}


function cleanPdfText(
  value
) {

  return String(
    value ?? ''
  )
    .replace(
      /[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,
      ''
    )
    .replace(
      /[✓✔☑☒]/g,
      'X'
    );
}


async function buildCompletedPdf() {

  if (
    !state.signSession ||
    !state.signSession
      .pdfBase64
  ) {
    throw new Error(
      'The signing PDF is unavailable.'
    );
  }

  const {
    PDFDocument,
    StandardFonts,
    rgb
  } = PDFLib;

  const pdfDoc =
    await PDFDocument.load(
      fromB64(
        state.signSession
          .pdfBase64
      )
    );

  const font =
    await pdfDoc.embedFont(
      StandardFonts.Helvetica
    );

  const currentSequence =
    String(
      state.signSession
        .recipient
        .sequence
    );

  const pages =
    pdfDoc.getPages();

  for (
    const field of
    state.signSession.fields
  ) {

    const owned =
      !field.recipientRole ||
      String(
        field.recipientRole
      ) ===
      currentSequence;

    if (!owned) {
      continue;
    }

    if (
      field.value ===
        undefined ||
      field.value ===
        null ||
      String(field.value) ===
        ''
    ) {
      continue;
    }

    const pageIndex =
      Number(field.page);

    if (
      !Number.isInteger(
        pageIndex
      ) ||
      pageIndex < 0 ||
      pageIndex >=
        pages.length
    ) {
      throw new Error(
        'Field "' +
        String(field.type) +
        '" points to an invalid PDF page.'
      );
    }

    const page =
      pages[pageIndex];

    const rect =
      pdfFieldRect(
        page,
        field
      );

    const x =
      rect.x;

    const y =
      rect.y;

    const w =
      rect.width;

    const h =
      rect.height;

    if (
      w <= 0 ||
      h <= 0
    ) {
      continue;
    }

    if (
      field.type ===
        'signature' ||
      field.type ===
        'initials'
    ) {

      if (
        String(
          field.value
        ).startsWith(
          'data:image/'
        )
      ) {

        const raw =
          String(
            field.value
          ).split(',')[1];

        const bytes =
          Uint8Array.from(
            atob(raw),
            function(c) {
              return c.charCodeAt(0);
            }
          );

        const image =
          await pdfDoc.embedPng(
            bytes
          );

        const dimensions =
          image.scale(1);

        const scale =
          Math.min(
            w /
              dimensions.width,
            h /
              dimensions.height
          );

        const imageWidth =
          dimensions.width *
          scale;

        const imageHeight =
          dimensions.height *
          scale;

        page.drawImage(
          image,
          {
            x:
              x +
              (
                w -
                imageWidth
              ) /
                2,

            y:
              y +
              (
                h -
                imageHeight
              ) /
                2,

            width:
              imageWidth,

            height:
              imageHeight
          }
        );
      }

      continue;
    }

    if (
      field.type ===
      'checkbox'
    ) {

      const checked =
        field.value === true ||
        String(
          field.value
        ) === 'true';

      if (checked) {

        const size =
          Math.max(
            7,
            Math.min(
              18,
              h * .65
            )
          );

        page.drawText(
          'X',
          {
            x:
              x +
              (
                w -
                size
              ) /
                2,

            y:
              y +
              (
                h -
                size
              ) /
                2 +
              1,

            size,

            font,

            color:
              rgb(
                .15,
                .15,
                .15
              )
          }
        );
      }

      continue;
    }

    const text =
      cleanPdfText(
        field.value
      );

    if (!text) {
      continue;
    }

    const padding =
      Math.max(
        2,
        Math.min(
          5,
          h * .12
        )
      );

    const availableWidth =
      Math.max(
        1,
        w -
          padding * 2
      );

    const availableHeight =
      Math.max(
        1,
        h -
          padding * 2
      );

    let fontSize =
      Math.max(
        6,
        Math.min(
          16,
          h * .58
        )
      );

    while (
      fontSize > 6 &&
      font.widthOfTextAtSize(
        text.split(/\r?\n/)[0],
        fontSize
      ) >
        availableWidth
    ) {
      fontSize -= .5;
    }

    const lineHeight =
      fontSize * 1.15;

    const maxLines =
      Math.max(
        1,
        Math.floor(
          availableHeight /
          lineHeight
        )
      );

    const rawLines =
      text.split(
        /\r?\n/
      );

    const lines = [];

    for (
      const rawLine of
      rawLines
    ) {

      let line =
        rawLine;

      if (
        font.widthOfTextAtSize(
          line,
          fontSize
        ) <=
        availableWidth
      ) {

        lines.push(
          line
        );

        continue;
      }

      let chunk =
        '';

      for (
        const word of
        line.split(/\s+/)
      ) {

        const test =
          chunk
            ? chunk +
              ' ' +
              word
            : word;

        if (
          font.widthOfTextAtSize(
            test,
            fontSize
          ) <=
          availableWidth
        ) {

          chunk =
            test;

        } else {

          if (chunk) {
            lines.push(
              chunk
            );
          }

          chunk =
            word;
        }
      }

      if (chunk) {
        lines.push(
          chunk
        );
      }
    }

    const visible =
      lines.slice(
        0,
        maxLines
      );

    const firstY =
      y +
      h -
      padding -
      fontSize;

    visible.forEach(
      function(line, index) {

        page.drawText(
          line,
          {
            x:
              x +
              padding,

            y:
              firstY -
              index *
                lineHeight,

            size:
              fontSize,

            font,

            color:
              rgb(
                .15,
                .15,
                .15
              )
          }
        );

      }
    );
  }

  return toB64(
    await pdfDoc.save()
  );
}


/* =========================================================
   COMPLETED DOCUMENT
   ========================================================= */

async function renderCompletedDocument() {

  $('#app').innerHTML = `

    <div class="sign-shell">

      <div class="empty">

        <div class="brand"
             style="margin-bottom:12px">
          SignedIt
        </div>

        <div class="spinner"></div>

        <h2 style="
          font:500 24px Georgia,serif
        ">
          Loading completed document…
        </h2>

        <div>
          Please wait.
        </div>

      </div>

    </div>
  `;

  const result =
    await api(
      'completedDocument',
      {
        token:
          state.signToken
      }
    );

  if (!result.success) {

    $('#app').innerHTML = `

      <div class="sign-shell">

        <div class="empty">

          <div class="brand"
               style="margin-bottom:12px">
            SignedIt
          </div>

          <h2 style="
            font:500 24px Georgia,serif
          ">
            Document not ready yet.
          </h2>

          <div>
            ${esc(
              result.message
            )}
          </div>

        </div>

      </div>
    `;

    return;
  }

  $('#app').innerHTML = `

    <div class="sign-shell">

      <div class="empty">

        <div class="brand"
             style="margin-bottom:12px">
          SignedIt
        </div>

        <h2 style="
          font:500 28px Georgia,serif
        ">
          Your signed document is ready.
        </h2>

        <div>
          ${esc(
            result.data
              ? result.data.documentName
              : ''
          )}
        </div>

        <div style="margin-top:18px">

          <button class="btn dark"
                  onclick="downloadCompleted()">
            Download signed document
          </button>

        </div>

      </div>

    </div>
  `;
}


async function downloadCompleted() {

  showProcessing(
    'Preparing download…',
    'Please wait while SignedIt retrieves your completed signed document.'
  );

  const result =
    await api(
      'completedDocument',
      {
        token:
          state.signToken
      }
    );

  hideProcessing();

  if (!result.success) {

    toast(
      result.message
    );

    return;
  }

  const bytes =
    Uint8Array.from(
      atob(
        result.data.pdfBase64
      ),
      function(c) {
        return c.charCodeAt(0);
      }
    );

  const blob =
    new Blob(
      [bytes],
      {
        type:
          'application/pdf'
      }
    );

  const url =
    URL.createObjectURL(
      blob
    );

  const anchor =
    document.createElement(
      'a'
    );

  anchor.href =
    url;

  anchor.download =
    result.data.documentName ||
    'SignedIt - Completed.pdf';

  document.body.append(
    anchor
  );

  anchor.click();

  anchor.remove();

  setTimeout(
    function() {
      URL.revokeObjectURL(
        url
      );
    },
    1000
  );
}


/* =========================================================
   START
   ========================================================= */

render();
